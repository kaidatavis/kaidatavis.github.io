name: Deploy to GitHub Pages

# Deploys the pre-built static files committed in dist/. There is no build step
# here on purpose: the artefact is whatever was last committed, so what you
# preview locally is exactly what goes live.
#
# Run `pnpm run deploy` to rebuild dist/ and push it.

on:
  push:
    paths:
      - 'dist/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment; queue instead, so the live site is
# never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Check dist/ is present
        run: |
          if [ ! -d dist ]; then
            echo "::error::dist/ was not committed. Run 'pnpm run deploy' locally and push the result."
            exit 1
          fi
          echo "Deploying $(find dist -type f | wc -l | tr -d ' ') files from dist/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4