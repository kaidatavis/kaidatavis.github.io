name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by GitHub Pages: write access for the deployment, and an OIDC token
# so the deploy can be authorised without a long-lived token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight deployment; queue instead, so the live site is
# never left in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        # Version comes from the `packageManager` field in package.json.

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate the deploy on the same checks run locally. `astro check` surfaces
      # type errors in .astro files that the bundler happily ignores.
      - run: pnpm run typecheck
      - run: pnpm run bib:check

      - run: pnpm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4